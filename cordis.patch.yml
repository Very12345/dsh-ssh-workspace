- insert:
    - id: ssh-workspace-local-world
      name: cordis:group
      group: true
      isolate: { fs: true, subprocess: true, spillStore: true, shell: true }
      config:
        - id: ssh-local-subprocess
          name: '@deepseek-ai/dsh-subprocess-local'
        - id: ssh-local-fs
          name: '@deepseek-ai/dsh-fs-sandbox'
        - id: ssh-local-spill
          name: '@deepseek-ai/dsh-spill-local'
        - id: ssh-local-bash
          name: '@deepseek-ai/dsh-bash-sandbox'
          disabled: !!js process.platform === 'win32'
        - id: ssh-local-pwsh
          name: '@deepseek-ai/dsh-pwsh-sandbox'
          disabled: !!js process.platform !== 'win32'
        - id: ssh-local-bridge
          name: '@very12345/dsh-ssh-workspace/bridge'
    - id: ssh-workspace-manager
      name: '@very12345/dsh-ssh-workspace/provider/manager'
      config:
        aliasRoot: !!js dshHomePath('ssh-workspace/projects')
        servers: []
        workspaces: []
    - id: ssh-workspace
      name: '@very12345/dsh-ssh-workspace'
      inject: [remoteSshManager]
    - id: ssh-workspace-files
      name: '@very12345/dsh-ssh-workspace/provider/fs'
      inject: [localFs, remoteSshManager]
    - id: ssh-workspace-processes
      name: '@very12345/dsh-ssh-workspace/provider/subprocess'
      inject: [localSubprocess, remoteSshManager]
    - id: ssh-workspace-spill
      name: '@very12345/dsh-ssh-workspace/provider/spill'
      inject: [localSpillStore, remoteSshManager]
    - id: ssh-workspace-search
      name: '@very12345/dsh-ssh-workspace/provider/search'
      inject: [remoteSshManager, loader]
    - id: ssh-workspace-shell
      name: '@very12345/dsh-ssh-workspace/shell'
      config:
        dialect: !!js "process.platform === 'win32' ? 'pwsh' : 'bash'"
    - id: ssh-workspace-policy
      name: '@very12345/dsh-ssh-workspace/policy'
- id: subprocess
  disabled: true
- id: fs-sandbox
  disabled: true
- id: spill-local
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs-search
  disabled: true
- id: preset-standard
  inject: [remoteSshSearchHook]
- id: preset-ptc
  inject: [remoteSshSearchHook]
- id: preset-cordis
  inject: [remoteSshSearchHook]
